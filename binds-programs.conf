bind=SUPER,e,spawn,nautilus --new-window
bind=SUPER+SHIFT,n,spawn,gnome-text-editor --new-window
bind=SUPER+SHIFT,return,spawn,emacsclient -c -a 'emacs'

bind=SUPER,b,spawn,flatpak run org.mozilla.firefox
bind=SUPER+SHIFT,b,spawn,flatpak run app.zen_browser.zen
bind=SUPER+Ctrl,b,spawn,helium

bind=CTRL+SHIFT,Escape,spawn,flatpak run io.missioncenter.MissionCenter
bind=CTRL+ALT,Delete,spawn,flatpak run io.missioncenter.MissionCenter
bind=SUPER,Delete,spawn,flatpak run io.missioncenter.MissionCenter

bind=NONE,XF86Favorites,spawn,gnome-calculator
bind=Shift,XF86Favorites,spawn,qalculate-gtk

bind=NONE,Print,spawn,flameshot gui
bind=SHIFT,Print,spawn,flameshot gui --last-region
bind=CTRL,Print,spawn,flameshot full

bind=SUPER,Print,spawn,flatpak run com.github.tenderowl.frog
bind=ALT,Print,spawn,flatpak run art.fatdawlf.Piccolo

# bind=SUPER+SHIFT,V,spawn,gnome-characters

bind=SUPER+SHIFT,a,spawn,gnome-calendar
bind=SUPER+SHIFT,m,spawn,~/AppImages/melia*

bind=SUPER,a,toggle_named_scratchpad,superproductivity,none,flatpak run com.super_productivity.SuperProductivity
bind=SUPER,n,toggle_named_scratchpad,nvim-scratchpad,none,kitty --class nvim-scratchpad -e nvim -c SoftPencil
bind=SUPER,m,toggle_named_scratchpad,com.rtosta.zapzap,none,flatpak run com.rtosta.zapzap
bind=SUPER+SHIFT,c,toggle_named_scratchpad,bitwarden,none,flatpak run com.bitwarden.desktop

# Script para poner rayas
bind=SUPER+ALT,Minus,spawn,~/.config/mango/scripts/raya
